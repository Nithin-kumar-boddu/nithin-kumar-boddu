<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0616"/>
      <stop offset="0.48" stop-color="#10142B"/>
      <stop offset="1" stop-color="#062B35"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="40" x2="1040" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
